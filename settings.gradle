pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

rootProject.name = 'swgc'
include 'common'
include 'fabric'
